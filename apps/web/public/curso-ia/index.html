 | Texto de entrada enviado ao modelo. |\n| **Prompt injection** | Instruções maliciosas que levam o modelo a agir fora do esperado. |\n| **Pydantic** | Biblioteca Python de modelos de dados com validação. |\n| **Qdrant** | Banco de dados vetorial. |\n| **RAG** | Buscar trechos relevantes e incluí-los no prompt antes de gerar a resposta. |\n| **Reducer** | Regra que define como combinar valores de um campo do estado. |\n| **Resource (MCP)** | Dado que um servidor MCP oferece para leitura. |\n| **Saída estruturada** | Resposta do modelo em formato validado por schema. |\n| **State (estado)** | Dados compartilhados entre os nós do grafo. |\n| **stdio** | Transporte MCP por entrada/saída padrão de um processo local. |\n| **Store** | Armazenamento de memória de longo prazo do LangGraph. |\n| **Subgrafo** | Grafo compilado usado como nó de outro grafo. |\n| **Supervisor** | Agente que decide qual agente roda em seguida. |\n| **thread_id** | Identificador de uma execução cujo estado é salvo. |\n| **Token (LLM)** | Unidade de texto que o modelo processa; base do custo. |\n| **Token (autenticação)** | Credencial que autoriza acesso a uma API. |\n| **Tool (ferramenta)** | Função com nome, descrição e parâmetros que o modelo pode pedir para executar. |\n| **uv** | Gerenciador de projetos e pacotes Python. |\n| **Vetor** | Lista de números que representa um ponto em um espaço. |\n| **Webhook** | Chamada HTTP que um serviço envia quando um evento acontece. |\n"}, {"id": "14-prompt-de-aula", "title": "Prompt de aula (colar no início de um chat novo)", "md": "# Prompt de aula (colar no início de um chat novo)\n\nCopie tudo dentro do bloco abaixo e cole como primeira mensagem. Depois escreva só: `Aula: <tópico>` (exemplo: `Aula: LangGraph interrupt`).\n\n````text\nVocê será meu tutor de engenharia de agentes de IA. Leia tudo antes de responder.\n\n## Quem eu sou\nAnderson, Senior Full-Stack (React Native/Expo, TypeScript, Node, Python/FastAPI). Sou autista e tenho altas habilidades/superdotação. Português do Brasil é minha língua principal. Leio inglês técnico (B2).\nMeta: me qualificar para vagas de Agente de IA que pedem LangChain, LangGraph, LangMem, MCP (Model Context Protocol), banco vetorial, Docker, multiagente, segurança de agentes e Cursor.\nProjeto-base: `rn-pr-review-agent`, um agente que revisa pull requests de apps React Native/Expo (Python 3.12, uv, LangGraph, FastMCP, Qdrant, LangMem, pytest, ruff, Docker Compose).\nMaterial de apoio: o curso em site (pasta `course/`). Quando eu colar um trecho dele, use-o como fonte.\n\n## Como adaptar a explicação (regras obrigatórias)\n1. Linguagem literal e precisa. Sem ironia, sem metáfora solta, sem expressões idiomáticas, sem \"é só fazer X\". Se usar uma analogia, avise com \"Analogia:\" e diga onde ela deixa de valer.\n2. Estrutura fixa e previsível em toda aula, sempre nesta ordem:\n   - **Objetivo** (1 frase)\n   - **Pré-requisitos** (lista; se faltar algo, avise antes de começar)\n   - **Mapa** (visão geral em lista numerada ou diagrama de texto; mostre o todo antes das partes)\n   - **Conceito** (definição exata, depois o porquê, depois o como)\n   - **Exemplo mínimo** (código curto, explicado linha por linha)\n   - **Erros comuns** (o que costuma dar errado e como reconhecer)\n   - **Checagem** (3 perguntas com resposta objetiva, que eu respondo antes de você revelar o gabarito)\n   - **Próximo passo** (1 item)\n3. Um assunto por vez. Antes de mudar de assunto, avise: \"Vou mudar de X para Y.\" Não misture dois conceitos novos na mesma explicação.\n4. Mostre o \"porquê\" de cada decisão de design e quais alternativas existem, com prós e contras. Eu preciso do modelo mental completo, não só da receita.\n5. Dê o nome técnico exato de cada coisa e a primeira vez que um termo aparecer, defina. Se um termo tem dois significados, diga os dois.\n6. Perguntas para mim devem ter resposta objetiva (\"O que acontece se X?\"), nunca abertas e vagas (\"O que você acha?\").\n7. Profundidade em camadas: dê primeiro a versão curta (até 10 linhas). Termine perguntando: \"Quer aprofundar em: (a) internals, (b) alternativas, (c) casos extremos, (d) próximo tópico?\" Não despeje tudo de uma vez.\n8. Quando eu pedir código, me deixe escrever a parte central: entregue o esqueleto com `TODO` marcados e a explicação do que cada TODO deve fazer. Só entregue a solução se eu pedir. Se eu travar, dê uma dica antes da resposta.\n9. Seja honesto sobre incerteza. Se não tiver certeza de uma API ou versão, diga e me diga como verificar (comando ou página da documentação). Nunca invente funções, parâmetros ou métricas.\n10. Sem tom infantil, sem elogios vazios. Seja direto, respeitoso e específico quando eu acertar ou errar.\n11. Mensagens de tamanho moderado. Se o conteúdo for grande, divida em partes numeradas e espere eu dizer \"continuar\".\n12. Se eu disser \"pausa\" ou \"resumo\", dê um resumo de no máximo 8 linhas do que vimos e o que falta.\n\n## Tópicos que você deve conseguir ensinar\nPython moderno (tipos, async, Pydantic) · chamadas de LLM e saída estruturada · tools · LangChain · RAG (embeddings, chunking, Qdrant) · Docker/Compose · LangGraph (estado, nós, arestas, checkpoint, interrupt, human-in-the-loop) · multiagente e agente-para-agente · MCP (servidor FastMCP, cliente, Claude Code, Cursor) · canais (CLI, API, webhook) · LangMem · segurança (prompt injection, allowlist, menor privilégio, segredos) · testes e evals · CI, entrega e preparação para entrevistas.\n\n## Modos (eu escolho no começo da mensagem)\n- `Aula: <tópico>` → aula completa na estrutura acima.\n- `Dúvida: <pergunta>` → resposta direta em até 10 linhas, depois o oferecimento de aprofundar.\n- `Revisar: <código>` → revise e explique o que está certo, o que está errado e por quê, sem reescrever tudo.\n- `Treino: <tópico>` → faça 5 perguntas objetivas, uma por vez, e corrija cada resposta.\n- `Entrevista: <tópico>` → simule um entrevistador técnico em inglês simples (B2), uma pergunta por vez, e depois dê feedback em português.\n\nConfirme que entendeu respondendo apenas: \"Pronto. Qual é a primeira aula?\"\n````\n\n## Por que este prompt está assim (para você, não para o chat)\n- **Estrutura fixa** reduz o custo de descobrir onde está cada informação.\n- **Linguagem literal** evita gastar energia decifrando sentido figurado.\n- **Camadas de profundidade** respeitam o ritmo: você escolhe quando ir fundo.\n- **Perguntas objetivas** removem a ambiguidade do \"o que você acha\".\n- **Modos nomeados** deixam o comportamento previsível.\n- Altere qualquer regra que não funcionar para você. O prompt é seu.\n"}];
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v) }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};
let done = store.get('done', {});
let current = 0;

/* ---------- settings ---------- */
const DEF = {theme:'auto', fs:18, w:760, motion:false};
let S = Object.assign({}, DEF, store.get('settings', {}));
function applySettings(){
  const r = document.documentElement;
  if (S.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.theme);
  r.style.setProperty('--fs', S.fs + 'px');
  r.style.setProperty('--w', S.w + 'px');
  document.body.classList.toggle('no-motion', !!S.motion);
  $('#theme').value = S.theme; $('#fs').value = S.fs; $('#w').value = S.w; $('#motion').checked = !!S.motion;
  store.set('settings', S);
  if (window.mermaid) renderMermaidTheme();
}
$('#theme').onchange = e => { S.theme = e.target.value; applySettings(); render(current, true) };
$('#fs').oninput = e => { S.fs = +e.target.value; applySettings() };
$('#w').oninput = e => { S.w = +e.target.value; applySettings() };
$('#motion').onchange = e => { S.motion = e.target.checked; applySettings() };
$('#reset').onclick = () => { S = Object.assign({}, DEF); applySettings(); render(current, true) };
$('#setbtn').onclick = () => { const s = $('#settings'); s.hidden = !s.hidden; $('#setbtn').setAttribute('aria-expanded', String(!s.hidden)) };
$('#focusbtn').onclick = () => document.body.classList.toggle('focus');
$('#menubtn').onclick = () => document.body.classList.toggle('menu-open');

/* ---------- mermaid ---------- */
function isDark(){
  const t = document.documentElement.getAttribute('data-theme');
  return t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches);
}
function renderMermaidTheme(){
  mermaid.initialize({startOnLoad:false, theme: isDark() ? 'dark' : 'default', securityLevel:'strict', flowchart:{useMaxWidth:true}});
}

/* ---------- menu ---------- */
function buildMenu(filter){
  const ol = $('#list'); ol.innerHTML = '';
  const f = (filter || '').trim().toLowerCase();
  LESSONS.forEach((l, i) => {
    if (f && !(l.title.toLowerCase().includes(f) || l.md.toLowerCase().includes(f))) return;
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = '#/' + l.id;
    a.className = done[l.id] ? 'done' : 'todo';
    if (i === current) a.setAttribute('aria-current', 'page');
    const span = document.createElement('span'); span.textContent = l.title;
    a.appendChild(span); li.appendChild(a); ol.appendChild(li);
  });
  const n = LESSONS.filter(l => done[l.id]).length;
  $('#prog').innerHTML = '';
  $('#prog').append(`${n} de ${LESSONS.length} lições concluídas`);
  const bar = document.createElement('div'); bar.className = 'bar';
  bar.innerHTML = '<i style="width:' + Math.round(100 * n / LESSONS.length) + '%"></i>';
  $('#prog').appendChild(bar);
}
$('#q').oninput = e => buildMenu(e.target.value);

/* ---------- render ---------- */
function decorate(art){
  art.querySelectorAll('blockquote').forEach(b => {
    const t = b.textContent;
    if (/Armadilha|⚠/.test(t.slice(0, 20))) b.classList.add('warn');
  });
  art.querySelectorAll('pre > code').forEach(code => {
    const pre = code.parentElement;
    if (code.className.includes('language-mermaid')) {
      const div = document.createElement('div'); div.className = 'mermaid'; div.textContent = code.textContent;
      pre.replaceWith(div); return;
    }
    if (window.hljs) { try { hljs.highlightElement(code) } catch(e){} }
    const b = document.createElement('button'); b.className = 'copy'; b.textContent = 'Copiar'; b.setAttribute('aria-label', 'Copiar código');
    b.onclick = async () => {
      try { await navigator.clipboard.writeText(code.textContent); b.textContent = 'Copiado ✔' } catch(e){ b.textContent = 'Erro' }
      setTimeout(() => b.textContent = 'Copiar', 1500);
    };
    pre.appendChild(b);
  });
  art.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener noreferrer' });
}
function render(i, keepScroll){
  current = i;
  const l = LESSONS[i];
  const art = $('#art');
  const y = window.scrollY;
  art.innerHTML = window.marked ? marked.parse(l.md) : '<pre>' + l.md.replace(/</g, '&lt;') + '</pre>';
  decorate(art);

  const box = document.createElement('div'); box.className = 'done-box';
  const lab = document.createElement('label');
  const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!done[l.id];
  cb.onchange = () => { done[l.id] = cb.checked; if (!cb.checked) delete done[l.id]; store.set('done', done); buildMenu($('#q').value) };
  lab.append(cb, ' Concluída');
  box.appendChild(lab); art.appendChild(box);

  const pager = document.createElement('div'); pager.className = 'pager';
  const prev = LESSONS[i - 1], next = LESSONS[i + 1];
  const mk = (txt, l2) => { const a = document.createElement('a'); a.href = '#/' + l2.id; a.textContent = txt; a.style.cssText = 'text-decoration:none'; const b = document.createElement('button'); b.textContent = txt; a.textContent = ''; a.appendChild(b); return a };
  pager.append(prev ? mk('← ' + prev.title, prev) : document.createElement('span'), next ? mk(next.title + ' →', next) : document.createElement('span'));
  art.appendChild(pager);

  $('#ttl').textContent = l.title;
  document.title = l.title + ' · Curso Agentes de IA';
  buildMenu($('#q').value);
  document.body.classList.remove('menu-open');
  if (window.mermaid) {
    renderMermaidTheme();
    mermaid.run({querySelector: '.mermaid'}).catch(() => {});
  }
  if (keepScroll) window.scrollTo(0, y); else { window.scrollTo(0, 0); art.focus({preventScroll:true}) }
  store.set('last', l.id);
}
function route(){
  const id = location.hash.replace(/^#\//, '') || store.get('last', LESSONS[0].id);
  let i = LESSONS.findIndex(l => l.id === id);
  if (i < 0) i = 0;
  render(i);
}
window.addEventListener('hashchange', route);
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if (e.key === 'ArrowRight' && LESSONS[current + 1]) location.hash = '#/' + LESSONS[current + 1].id;
  if (e.key === 'ArrowLeft' && LESSONS[current - 1]) location.hash = '#/' + LESSONS[current - 1].id;
  if (e.key === 'Escape') { $('#settings').hidden = true; document.body.classList.remove('menu-open') }
});
applySettings();
route();
</script>
</body>
</html>
