name: Azure web release
on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      homolog_run_id:
        description: Successful develop run ID to promote unchanged (dispatch on main)
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: azure-web-${{ github.event_name == 'push' && 'homolog' || 'production' }}
  cancel-in-progress: false
jobs:
  homolog:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: homolog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci && npm run build
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        with:
          name: azure-web-static
          path: apps/web/out
          if-no-files-found: error
          retention-days: 30
      - name: Restrict homolog to invited reviewers
        shell: pwsh
        run: ./infra/azure/prepare-artifact.ps1 -Source apps/web/out -Destination deploy-homolog -Environment homolog
      - name: Publish homolog
        id: deploy_homolog
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: deploy-homolog
          config_file_location: deploy-homolog
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: develop
      - name: Verify anonymous access is denied
        env:
          HOMOLOG_URL: ${{ steps.deploy_homolog.outputs.static_web_app_url }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HOMOLOG_URL" =~ ^https://[a-z0-9.-]+\.azurestaticapps\.net/?$ ]]
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 "${HOMOLOG_URL%/}/")
          [[ "$status" == 401 || "$status" == 403 ]]
  production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Configure this environment's main-only deployment policy and reviewers in GitHub.
    # Declaring the name here does not create approval protection.
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify successful homolog provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.homolog_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/homolog-run.json"
          jq -e '.path == ".github/workflows/deploy-azure-web.yml" and .head_branch == "develop" and .event == "push" and .conclusion == "success"' "$RUNNER_TEMP/homolog-run.json"
          source_sha=$(jq -r '.head_sha' "$RUNNER_TEMP/homolog-run.json")
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$source_sha" HEAD
      - uses: actions/download-artifact@v4
        with:
          name: azure-web-static
          path: deploy-production
          run-id: ${{ inputs.homolog_run_id }}
          github-token: ${{ github.token }}
      - name: Check static artifact
        run: test -f deploy-production/index.html && test -f deploy-production/staticwebapp.config.json
      - name: Promote original public artifact
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: deploy-production
          config_file_location: deploy-production
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main
