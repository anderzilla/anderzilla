ke="#ACC8FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><text x="64" y="215" fill="#F4F7FF" font-family="Arial" font-size="52" font-weight="800"><tspan x="64" dy="0">TypeScript 7: por que um</tspan><tspan x="64" dy="58.75999999999999">compilador escrito em Go</tspan><tspan x="64" dy="58.75999999999999">importa</tspan></text><text x="64" y="413.28" fill="#A9B6CE" font-family="Arial" font-size="21"><tspan x="64" dy="0">O TypeScript 7 estreou em julho com uma base nativa em</tspan><tspan x="64" dy="32">Go. Para devs, a oportunidade está no tempo de</tspan><tspan x="64" dy="32">desenvolvimento, não numa mudança de linguagem do app.</tspan></text><text x="64" y="575" font-family="Arial" font-size="18" fill="#C2FF36" letter-spacing="1">ANDERZILLA.COM</text><text x="1136" y="575" text-anchor="end" font-family="Arial" font-size="13" fill="#A9B6CE">ARTE EDITORIAL ORIGINAL</text></svg>